# Workflow for manual pigallery2 builds and image creation.
# Uploads to YOUR docker hub account, given the 3 secrets:
#   - `REGISTRY_NAMESPACE` (your docker-hub namespace - typically your username)
#   - `REGISTRY_USERNAME` (your docker-hub username)
#   - `REGISTRY_PASSWORD` (your generated Personal Access Token from docker-hub - needs to have read and write privileges)

# Why have this?
# - Easy multi architecture building and image creation.
# - You don't have to worry about QEMU and other tedious build setups.
# - You want use and test your fork of pigallery2 on another architecture than the one you are developing on.
#
# What makes it different from the build workflow?
# - Runs only manually
# - Allows you to select any commit, if you want to compare behavior
# Tags your version : 0.0.0-unstable.YYYYMMDD.shortsha

name: docker-buildx-from-commit
run-name: Build pigallery2 from ${{ github.event.inputs.commit_id || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      commit_id:
        description: 'Commit SHA to build from (leave blank for current branch HEAD)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: getong/mariadb-action@v1.11
        with:
          mysql database: 'pigallery_test'
          mysql root password: 'password'
          mysql user: 'user'
          mysql password: 'password'

      - name: Determine ref to build
        id: ref
        run: |
          if [ -z "${{ github.event.inputs.commit_id }}" ]; then
            echo "ref=${GITHUB_REF}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.commit_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout specific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0   # ensure full history so commit is available

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify MariaDB connection
        env:
          PORT: 3306
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"$PORT" --silent; do
            sleep 1
          done

      - name: npm install and build
        run: |
          npm ci
          npm run build

      - name: lint
        run: npm run lint

      - name: test
        run: |
          npm test
          npm run coverage
        env:
          MYSQL_HOST: localhost
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: password
          MYSQL_PORT: 3306
          PORT: 35000
          CI: true

      - name: Coveralls
        uses: coverallsapp/github-action@v2

      - name: E2E test - Cypress run
        uses: cypress-io/github-action@v6
        env:
          DEBUG: '@cypress/github-action'
        with:
          start: npm run start-e2e-server

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: test/cypress/screenshots
          if-no-files-found: ignore

  create-release:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Determine ref to build
        id: ref
        run: |
          if [ -z "${{ github.event.inputs.commit_id }}" ]; then
            echo "ref=${GITHUB_REF}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.commit_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout specific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0   # ensure full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Deps
        run: npm ci --unsafe-perm

      - name: Create Release
        run: npm run create-release -- --skip-opt-packages=ffmpeg-static,ffprobe-static --force-opt-packages

      - uses: actions/upload-artifact@v4
        with:
          name: pigallery2-release
          path: release

  build-dockerx:
    runs-on: ubuntu-latest
    needs: [create-release]
    strategy:
      matrix:
        container: [alpine, debian-bullseye, debian-bookworm]
        include:
          - container: alpine
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - container: debian-bullseye
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - container: debian-bookworm
            platforms: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      - name: Determine ref to build
        id: ref
        run: |
          if [ -z "${{ github.event.inputs.commit_id }}" ]; then
            echo "ref=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.commit_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout specific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: pigallery2-release
          path: pigallery2-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive version string
        id: version
        run: |
          # Determine commit SHA (input or HEAD)
          if [ -z "${{ github.event.inputs.commit_id }}" ]; then
            sha=$(git rev-parse HEAD)
          else
            sha="${{ github.event.inputs.commit_id }}"
          fi

          ts=$(git show -s --format=%ct "$sha")
          date=$(date -u -d @$ts +%Y%m%d%H%M%S)
          short_sha=$(echo "$sha" | cut -c1-7)

          echo "version=0.0.0-unstable.${date}.${short_sha}" >> $GITHUB_OUTPUT

      - name: Override release package.json version
        run: |
          ver="${{ steps.version.outputs.version }}"
          echo "Setting pigallery2-release/package.json version to $ver"
          jq --arg v "$ver" '.version=$v' pigallery2-release/package.json > pigallery2-release/package.json.tmp && mv pigallery2-release/package.json.tmp pigallery2-release/package.json
          grep '"version"' pigallery2-release/package.json

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platforms }}
          push: true
          no-cache: true
          tags: |
            ${{ secrets.REGISTRY_NAMESPACE }}/pigallery2:${{ steps.version.outputs.version }}-${{ matrix.container }}
            ${{ secrets.REGISTRY_NAMESPACE }}/pigallery2:${{ steps.version.outputs.version }}
